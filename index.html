<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Brazuca Ganes</title>
        <link rel="stylesheet" href="/css/reset.css" />
        <link rel="stylesheet" href="/css/style.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <header class="inicio">
            <h1>Brazuca Games</h1>
            <h2>Inicio</h2>
            <nav class="navegacao">
                <a href="index.html">Inicio</a>

                <a href="pages/explorar.html">Explorar</a>

                <a href="pages/comunidade.html">Comunidade</a>

                <a href="pages/categorias.html">Categorias</a>

                <a href="pages/desenvolvedores.html">Desenvolvedores</a>

                <a href="pages/novidades.html">Novidades</a>
            </nav>
        </header>
        <main class="principal">
            <section class="jogos" aria-labelledby="titulo_jogos">
                <h2 class="titulo_jogos">Jogos Recentes</h2>
                <div class="grid_jogos">
                    <article class="card_jogo">
                        <figure>
                            <img src="assets/image/spa.png" alt="Capa do jogo" />
                            <h3>Super Paulista Adventures</h3>
                            <figcaption class="genero_jogo">#Ação #Aventura</figcaption>
                            <p class="desc_jogo">
                                Um jogo de plataforma onde você se aventura em São Paulo coletando
                                moedas para comprar e aprimorar sua casa propria!
                            </p>
                            <button>Jogar</button>
                        </figure>
                    </article>
                    <article class="card_jogo">
                        <figure>
                            <img src="assets/image/Frogs.png" alt="Capa do jogo" />
                            <h3>Frog's Revenge</h3>
                            <figcaption class="genero_jogo">#Aventura #Parodia</figcaption>
                            <p class="desc_jogo">
                                Depois de tanto sofrer para os motoristas imprudentes, você
                                finalmente vai ter sua vingança!
                            </p>
                            <button>Jogar</button>
                        </figure>
                    </article>
                    <article class="card_jogo">
                        <figure>
                            <img src="assets/image/clown.png" alt="Capa do jogo" />
                            <h3>The Clown fish Ascension</h3>
                            <figcaption class="genero_jogo">#Ação #Aventura</figcaption>
                            <p class="desc_jogo">
                                Ascenda de um pequeno peixe a uma grande ameaça!
                            </p>
                            <button>Jogar</button>
                        </figure>
                    </article>
                    <article class="card_jogo">
                        <figure>
                            <img src="assets/image/notmydad.png" alt="Capa do jogo" />
                            <h3>Não é o meu Pai</h3>
                            <figcaption class="genero_jogo">#Terror #Misterio</figcaption>
                            <p class="desc_jogo">Aquilo na sala não é o meu pai!</p>
                        </figure>
                        <button>Jogar</button>
                    </article>
                </div>
            </section>
            <section class="jogos" aria-labelledby="titulo_jogos">
                <h2 class="titulo_jogos">Recomendado para você</h2>
                <div class="grid_jogos">
                    <article class="card_jogo">
                        <figure>
                            <img src="assets/image/dcnm.png" alt="Capa do Jogo" />
                            <h3>Dois caras em uma moto!</h3>
                            <figcaption class="genero_jogo">#Terror #Psicologico</figcaption>
                            <p class="desc_jogo">
                                Um jogo de terror onde você está sendo seguido por dois caras em uma
                                moto, mas tem algo mais sombrio atrás de você e eles tambem!
                            </p>
                            <button>Jogar</button>
                        </figure>
                    </article>
                    <article class="card_jogo">
                        <figure>
                            <img src="assets/image/thebrokenvow.png" alt="Capa do jogo" />
                            <h3>O voto quebrado</h3>
                            <figcaption class="genero_jogo">#Terror #Misterio</figcaption>
                            <p class="desc_jogo">
                                A minha vó está estranha, ela se transforma toda vez que fica
                                escuro!
                            </p>
                            <button>Jogar</button>
                        </figure>
                    </article>
                    <article class="card_jogo">
                        <figure>
                            <img src="assets/image/caixaDoMedo.png" alt="Capa do jogo" />
                            <h3>A Caixa do Medo</h3>
                            <figcaption class="genero_jogo">
                                #Suspense #Terror #Psicologico
                            </figcaption>
                            <p class="desc_jogo">
                                Investigue o desaparecimento de sua filha, e descubra verdades
                                escondidas da misteriosa empresa "A CAIXA".
                            </p>
                            <button>Jogar</button>
                        </figure>
                    </article>
                    <article class="card_jogo">
                        <figure>
                            <img src="assets/image/sapo.png" alt="Capa do jogo" />
                            <h3>HOPPING Around The World</h3>
                            <figcaption class="genero_jogo">#Ação #Aventura</figcaption>
                            <p class="desc_jogo">SAPO, CARROS o que mais você precisa saber?</p>
                            <button>Jogar</button>
                        </figure>
                    </article>
                </div>
            </section>
        </main>
        <br />
        <footer class="rodape">
            <h4>Projeto Integrador: Brazuca Games</h4>
            <p>Desenvolvedores :Bruno , Wisney, Jessica, Daniel e Yuri</p>
            <p>&copy; 2026 Brazuca Games. Todos os direitos reservados.</p>
        </footer>
    </body>
</html>
